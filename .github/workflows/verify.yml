name: Verify Dmark
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dmark-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Browser tests mock account routes; enable that UI in the test build.
          DMARK_ACCOUNT_API_URL: http://127.0.0.1:9
      - run: npm run test:launch
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmark-browser-screenshots
          path: /tmp/dmark-*.png
          if-no-files-found: ignore
